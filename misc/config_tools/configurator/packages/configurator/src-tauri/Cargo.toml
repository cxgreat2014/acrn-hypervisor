[package]
name = "acrn-configurator"
version = "0.1.0"
description = "ACRN Configurator"
authors = ["Feng, Weiyi <weiyix.feng@intel.com>"]
license = "BSD"
repository = "https://github.com/projectacrn/acrn-hypervisor"
default-run = "acrn-configurator"
edition = "2021"
rust-version = "1.57"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
# Security fixes - keep these pinned versions
openssl = "0.10.64"
idna = "1.0.2"
url = "2.5.2"
tokio = "1.40.0"
crossbeam-channel = "0.5.13"

# Core dependencies
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
tauri = { version = "2.3.1", features = [ "devtools"] }
log = "0.4.22"
glob = "0.3.1"
dirs = "5.0.1"
itertools = "0.13.0"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
